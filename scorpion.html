<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scorpion — Autonomous Operations</title>
<meta name="description" content="Scorpion — single-file autonomous AI operations console for dropshipping." />
<meta name="theme-color" content="#0a0a0f" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦂</text></svg>" />

<!--
=============================================================================
  SCORPION 7.0 — SINGLE FILE BUILD
=============================================================================

  Autonomous AI operations console for a dropshipping business.
  Product research, content generation, revenue tracking, model routing.

  HOW TO RUN
    Save as scorpion.html and double-click it. That's it.
    No server, no npm, no build step, no internet.

  WHY ONE FILE
    Everything is inline — CSS, data, logic — so it runs from file://
    where fetch() is blocked by CORS. Paste it anywhere and it works.

  MAP (search for these banners to jump around)
    [01] THEME          CSS custom properties — change the look here
    [02] STYLES         All CSS
    [03] MARKUP         App shell + icon sprite
    [04] CONFIG         Tunable constants
    [05] SEED DATA      Products + clips (real AliExpress sourcing figures)
    [06] SALES ENGINE   Generates 30 days of orders from a seeded PRNG
    [07] MODEL REGISTRY Specialist catalog + routing table
    [08] AI LAYER       Arena / Fable / Runway clients (simulated w/o keys)
    [09] TASK ROUTER    Cost-aware routing + queue
    [10] MODULES        Scout, Studio, Tracker
    [11] STATE          Single store, one render path
    [12] UI HELPERS     Formatting + small components
    [13] VIEWS          One render function per screen
    [14] APP            Boot, nav, events

  STATUS
    No API keys are wired up, so every AI call returns a simulated
    response. Product costs and seller ratings are real (pulled from live
    AliExpress listings); order history and view counts are fabricated.
    Nothing here has spent money or touched a storefront.

  ADDING A VIEW
    1. Add a render function to VIEWS in [13]
    2. Add an entry to NAV in [04]
    Routing, nav, and hash URLs are automatic.

=============================================================================
-->

<style>
/* ==========================================================================
   [01] THEME — every colour and metric lives here
   ========================================================================== */
:root {
  --bg: #0a0a0f;
  --sidebar: #12121a;
  --card: #1a1a2e;
  --border: #2a2a3a;
  --border-strong: #3a3a4e;

  --accent: #00d4aa;
  --accent-dim: rgba(0, 212, 170, 0.12);
  --accent-line: rgba(0, 212, 170, 0.35);
  --accent-ink: #04231d;

  --text: #e8e8f0;
  --text-dim: #a0a0b8;
  /* #8585a0 clears WCAG AA (4.5:1) on every surface. Don't darken it. */
  --text-faint: #8585a0;

  --ok: #00d4aa;
  --warn: #f0b429;
  --danger: #f2555a;
  --info: #7c9cf0;
  --purple: #7c3aed;

  --radius: 8px;
  --sidebar-w: 248px;
  --speed: 200ms;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

/* ==========================================================================
   [02] STYLES
   ========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; }

/* Unsized inline SVG expands to fill its container — this prevents that.
   (A real bug once rendered 16px icons at 164px.) */
svg:not([width]) { width: 16px; height: 16px; flex: 0 0 auto; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--bg); }

/* --- shell --------------------------------------------------------------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: var(--sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 40;
  transition: transform var(--speed) ease;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 20px; border-bottom: 1px solid var(--border); }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--accent), #0891b2);
  display: grid; place-items: center; color: var(--accent-ink);
}
.brand-mark svg { width: 20px; height: 20px; }
.brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.brand-sub { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.09em; }

.nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
.nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint); padding: 10px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 10px; margin-bottom: 2px; background: none; border: 0;
  border-radius: var(--radius); color: var(--text-dim); font: inherit; font-size: 13.5px;
  text-align: left; cursor: pointer; transition: background var(--speed), color var(--speed);
}
.nav-item svg { width: 17px; height: 17px; }
.nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
.nav-item.active { background: var(--accent-dim); color: var(--accent); }
.nav-count {
  margin-left: auto; font-size: 11px; font-family: var(--mono); color: var(--text-faint);
  background: rgba(255,255,255,.05); border-radius: 20px; padding: 1px 7px;
}
.nav-item.active .nav-count { background: rgba(0,212,170,.18); color: var(--accent); }

.sidebar-foot { padding: 14px; border-top: 1px solid var(--border); }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--border); display: grid; place-items: center; font-size: 12px; color: var(--text-dim); }

.main { margin-left: var(--sidebar-w); min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
  padding: 16px 26px; background: rgba(10,10,15,.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
.topbar-actions { margin-left: auto; display: flex; gap: 10px; }
.menu-toggle { display: none; background: none; border: 0; color: var(--text); cursor: pointer; padding: 4px; }
.menu-toggle svg { width: 22px; height: 22px; }
.content { padding: 24px 26px 60px; }

/* --- buttons ------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px;
  border-radius: 20px; border: 1px solid transparent; font: inherit; font-size: 13px;
  font-weight: 500; cursor: pointer; transition: all var(--speed) ease; white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--text-dim); }
.btn-ghost:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-dim); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

/* --- cards --------------------------------------------------------------- */
.grid { display: grid; gap: 20px; }
.grid-kpi { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid-cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; transition: transform var(--speed), border-color var(--speed), box-shadow var(--speed);
}
.card-hover:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.spacer { margin-left: auto; }
.section { margin-bottom: 26px; }
.section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

.kpi-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); display: flex; align-items: center; gap: 7px; }
.kpi-label svg { width: 14px; height: 14px; opacity: .75; }
.kpi-value { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin: 9px 0 4px; }
.kpi-delta { font-size: 12px; color: var(--text-dim); }
.up { color: var(--ok); } .down { color: var(--danger); }

/* --- badges -------------------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 600; text-transform: capitalize; border: 1px solid transparent;
}
.badge-winning     { background: rgba(0,212,170,.13);  color: var(--ok);     border-color: rgba(0,212,170,.3); }
.badge-active      { background: rgba(124,156,240,.13); color: var(--info);   border-color: rgba(124,156,240,.3); }
.badge-sourcing    { background: rgba(240,180,41,.13);  color: var(--warn);   border-color: rgba(240,180,41,.3); }
.badge-researching { background: rgba(124,58,237,.16);  color: #b48bff;       border-color: rgba(124,58,237,.35); }
.badge-dead        { background: rgba(242,85,90,.12);   color: var(--danger); border-color: rgba(242,85,90,.3); }
.badge-neutral     { background: rgba(255,255,255,.05); color: var(--text-dim); border-color: var(--border); }
.badge-low    { background: rgba(0,212,170,.13);  color: var(--ok); }
.badge-medium { background: rgba(240,180,41,.13); color: var(--warn); }
.badge-high   { background: rgba(242,85,90,.12);  color: var(--danger); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }

/* --- chart --------------------------------------------------------------- */
.chart { display: flex; align-items: flex-end; gap: 3px; height: 190px; padding-top: 10px; }
.bar-wrap { flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; position: relative; min-width: 0; }
.bar {
  width: 100%; border-radius: 3px 3px 0 0; min-height: 2px;
  background: linear-gradient(180deg, var(--accent), rgba(0,212,170,.28));
  transition: filter var(--speed); animation: grow .5s cubic-bezier(.22,1,.36,1) backwards;
}
.bar-wrap:hover .bar { filter: brightness(1.35); }
@keyframes grow { from { height: 0 !important; } }
.tip {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: #05050a; border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 6px 9px; font-size: 11.5px; white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity var(--speed); z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.5);
}
.bar-wrap:hover .tip { opacity: 1; }
.tip-rev { color: var(--accent); font-weight: 600; }
.tip-date { color: var(--text-faint); }
.chart-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint); margin-top: 9px; border-top: 1px solid var(--border); padding-top: 8px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; background: var(--accent); }

/* --- tasks --------------------------------------------------------------- */
.task { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
.task:last-child { border-bottom: 0; padding-bottom: 0; }
.task:first-child { padding-top: 0; }
.task-icon { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto; background: rgba(255,255,255,.04); color: var(--text-dim); }
.task-icon.running { background: var(--accent-dim); color: var(--accent); }
.task-icon.done    { background: rgba(124,156,240,.12); color: var(--info); }
.task-icon.failed  { background: rgba(242,85,90,.12); color: var(--danger); }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 13.5px; font-weight: 500; }
.task-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
.task-meta code { font-family: var(--mono); color: var(--text-dim); font-size: 11px; }
.progress { height: 4px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s ease; }
.progress.failed i { background: var(--danger); }

/* --- product / clip cards ------------------------------------------------ */
.pcard { display: flex; flex-direction: column; gap: 12px; }
.pcard-top { display: flex; align-items: flex-start; gap: 10px; }
.pname { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.pcat { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
.metric-row { display: flex; gap: 18px; flex-wrap: wrap; }
.metric-k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
.metric-v { font-size: 15px; font-weight: 600; margin-top: 2px; }
.metric-v.accent { color: var(--accent); }
.meter { height: 5px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), #0891b2); }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; padding: 5px 10px; border-radius: 20px; background: rgba(255,255,255,.04);
  border: 1px solid var(--border); color: var(--text-dim); font-family: inherit;
}
button.chip { cursor: pointer; transition: all var(--speed); }
button.chip:hover, button.chip.on { border-color: var(--accent-line); color: var(--accent); }

/* --- tables -------------------------------------------------------------- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-faint); font-weight: 600; padding: 0 12px 10px;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.data td { padding: 12px; border-bottom: 1px solid var(--border); }
table.data tbody tr:hover { background: rgba(255,255,255,.02); }
table.data tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }
table.compact th, table.compact td { padding: 10px 8px; }
table.compact th:first-child, table.compact td:first-child { padding-left: 0; }
table.compact th:last-child,  table.compact td:last-child  { padding-right: 0; }

/* --- misc ---------------------------------------------------------------- */
.empty { text-align: center; padding: 46px 20px; border: 1px dashed var(--border-strong); border-radius: var(--radius); color: var(--text-dim); }
.empty svg { width: 34px !important; height: 34px !important; color: var(--text-faint); margin-bottom: 12px; }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--text-dim); }
.kv .v { font-family: var(--mono); font-size: 12.5px; }
.status-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.status-row:last-child { border-bottom: 0; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 9px 12px; background: #0f0f18; border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font: inherit; font-size: 13px;
}
.field input:focus { outline: none; border-color: var(--accent-line); }
.hint { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }

.toast-host { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 90; }
.toast {
  background: var(--card); border: 1px solid var(--border-strong); border-left: 3px solid var(--accent);
  border-radius: var(--radius); padding: 12px 16px; font-size: 13px; max-width: 340px;
  box-shadow: 0 12px 30px rgba(0,0,0,.45); animation: slidein .22s ease;
}
.toast.err { border-left-color: var(--danger); }
@keyframes slidein { from { opacity: 0; transform: translateX(16px); } }
.scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 35; }
.scrim.show { display: block; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .sidebar.open { transform: none; }
  .main { margin-left: 0; }
  .menu-toggle { display: block; }
  .content { padding: 18px 16px 50px; }
  .topbar { padding: 14px 16px; }
  h1 { font-size: 18px; }
  .grid { gap: 14px; }
}
@media (max-width: 560px) {
  .topbar-sub { display: none; }
  .grid-kpi { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .chart { height: 150px; }
  .btn span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>

/* =========================================================================
   [06] SALES ENGINE
   Generates a believable 30-day order history from a seeded PRNG, so the
   curve is identical on every load without shipping 2,000 lines of JSON.
   Change CONFIG.salesSeed for a different shape.
   ========================================================================= */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const round2 = (n) => Math.round(n * 100) / 100;

function generateSales(products, days, seed) {
  const rand = mulberry32(seed);
  const byId = Object.fromEntries(products.map((p) => [p.id, p]));
  const dates = [];
  const end = new Date(); end.setHours(0, 0, 0, 0);
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(end); d.setDate(d.getDate() - i);
    dates.push(d.toISOString().slice(0, 10));
  }

  const orders = [];
  let n = 0;
  dates.forEach((date, idx) => {
    const ramp = 0.35 + (idx / (days - 1)) * 1.5;                                  // growth over the month
    const weekend = [0, 6].includes(new Date(date + 'T00:00:00').getDay()) ? 1.25 : 1;
    const spike = (idx === 12 || idx === 13) ? 1.9 : 1;                             // a clip went viral
    // 4.9 lands the 30-day total near $4,200 whichever weekday you open it on.
    const count = Math.max(0, Math.round(4.9 * ramp * weekend * spike + (rand() - 0.5) * 2.2));

    for (let k = 0; k < count; k++) {
      const r = rand();
      // Product mix shifts over the month as winners emerge.
      let pid;
      if (idx < 6)       pid = r < 0.42 ? 'prd_cargel1' : r < 0.70 ? 'prd_grout01' : r < 0.86 ? 'prd_posture' : 'prd_petbrsh';
      else if (idx < 18) pid = r < 0.50 ? 'prd_grout01' : r < 0.78 ? 'prd_cargel1' : r < 0.94 ? 'prd_posture' : 'prd_petbrsh';
      else               pid = r < 0.62 ? 'prd_grout01' : r < 0.84 ? 'prd_cargel1' : r < 0.96 ? 'prd_posture' : 'prd_ledmask';

      const p = byId[pid]; if (!p) continue;
      const statusRoll = rand();
      orders.push({
        id: 'ord_' + date.replace(/-/g, '').slice(4) + String(++n).padStart(4, '0'),
        date, productId: pid,
        channel: rand() < (idx < 10 ? 0.42 : 0.55) ? 'tiktok-shop' : 'shopify',
        quantity: rand() < 0.16 ? 2 : 1,
        unitPrice: p.salePrice, unitCost: p.cost,
        status: statusRoll < 0.035 ? 'refunded'
              : idx > days - 5 ? (statusRoll < 0.5 ? 'paid' : 'shipped')
              : (statusRoll < 0.75 ? 'delivered' : 'shipped'),
      });
    }
  });
  return { orders, dates };
}

/** Recompute every derived figure from the order list. Single source of truth. */
function summarize(orders, dates) {
  const live = orders.filter((o) => o.status !== 'refunded');
  const revenue = round2(live.reduce((s, o) => s + o.unitPrice * o.quantity, 0));
  const cogs = round2(live.reduce((s, o) => s + o.unitCost * o.quantity, 0));

  const byChannel = {};
  const daily = Object.fromEntries(dates.map((d) => [d, { date: d, revenue: 0, orders: 0 }]));
  for (const o of orders) {
    const c = (byChannel[o.channel] ||= { revenue: 0, orders: 0 });
    c.orders++;
    if (daily[o.date]) daily[o.date].orders++;
    if (o.status === 'refunded') continue;
    const rev = o.unitPrice * o.quantity;
    c.revenue = round2(c.revenue + rev);
    if (daily[o.date]) daily[o.date].revenue = round2(daily[o.date].revenue + rev);
  }

  return {
    revenue, cogs,
    grossProfit: round2(revenue - cogs),
    orders: live.length,
    aov: live.length ? round2(revenue / live.length) : 0,
    marginPct: revenue ? round2(((revenue - cogs) / revenue) * 100) : 0,
    byChannel,
    daily: dates.map((d) => daily[d]),
  };
}

  'saturation-check':      { primary: 'gpt-5-thinking',   fallback: 'perplexity-sonar', escalate: 'fable-5' },
  'image-analysis':        { primary: 'gemini-flash',     fallback: 'claude-sonnet' },
  'hook-generation':       { primary: 'gpt-4o-mini',      fallback: 'llama-3-70b' },
  'listing-copy':          { primary: 'claude-sonnet',    fallback: 'gpt-5-thinking' },
  'video-generation':      { primary: 'runway-gen3',      fallback: null },
  'sales-analysis':        { primary: 'gpt-5-thinking',   fallback: 'claude-sonnet' },
};

const modelById = (id) => MODELS.find((m) => m.id === id) || null;

function usable(m) {
  if (!m || m.status === 'offline') return false;
  if (m.id === 'fable-5' && m.spendUsed >= m.spendLimit) return false;
  if (m.id === 'runway-gen3' && m.credits <= 0) return false;
  return true;
}

/** Pick the cheapest capable model. Order: override -> route -> capability. */
function selectModel(taskType, opts = {}) {
  const route = ROUTES[taskType] || {};
  const candidates = [
    opts.model,
    opts.escalate ? route.escalate : null,
    route.primary, route.fallback,
    ...MODELS.filter((m) => m.caps.includes(taskType)).map((m) => m.id),
    'claude-sonnet',
  ].filter(Boolean);

  for (const id of [...new Set(candidates)]) {
    const m = modelById(id);
    if (!usable(m)) continue;
    const reason = opts.model === id ? 'explicit override'
      : route.escalate === id && opts.escalate ? 'escalated to browser agent'
      : route.primary === id ? 'primary route'
      : route.fallback === id ? 'fallback route' : 'capability match';
    return { model: m, reason };
  }
  return null;
}

/* =========================================================================
   [08] AI LAYER — Arena / Fable / Runway
   With no key set, every call returns a simulated response. Swap the bodies
   of callArena / callFable for real fetch() calls when you have keys.
   ========================================================================= */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function getKeys() {
  try { return JSON.parse(localStorage.getItem('scorpion.keys') || '{}'); } catch { return {}; }
}
function setKeys(patch) {
  const next = { ...getKeys(), ...patch };
  localStorage.setItem('scorpion.keys', JSON.stringify(next));
  return next;
}
const isDemo = () => !getKeys().arena;

async function callArena(modelId, taskType, payload) {
  const keys = getKeys();
  if (!keys.arena) { await sleep(400 + Math.random() * 700); return { simulated: true, data: simulate(taskType, payload) }; }

  // --- real call (uncomment and adjust when you have a key) ---------------
  const res = await fetch('https://api.arena.ai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + keys.arena },
    body: JSON.stringify({
      model: modelId,
      messages: [
        { role: 'system', content: 'You are a Scorpion specialist agent. Return JSON only.' },
        { role: 'user', content: `Task: ${taskType}\nPayload: ${JSON.stringify(payload)}` },
      ],
    }),
  });
  if (!res.ok) throw new Error('Arena HTTP ' + res.status);
  const json = await res.json();
  return { simulated: false, data: json.choices?.[0]?.message?.content };
}

/** Deterministic stand-ins. Keep these schema-correct or the UI lies. */
function simulate(taskType, payload = {}) {
  switch (taskType) {
    case 'trend-research':
      return { items: [
        { name: 'Grout restoration pen', momentum: 'rising',  source: 'TikTok #cleantok' },
        { name: 'Heatless curling ribbon', momentum: 'peaking', source: 'TikTok #beautytok' },
        { name: 'Magnetic gym phone mount', momentum: 'rising', source: 'Amazon Sports' },
      ] };
    case 'product-scout':
      return { candidates: [
        { name: 'Grout Restore Pen',   category: 'home', cost: 2.66, price: 19.95 },
        { name: 'UV Resin Repair Pen', category: 'tech', cost: 0.99, price: 16.95 },
        { name: 'Rust Remover Gel',    category: 'auto', cost: 1.33, price: 14.95 },
      ] };
    case 'margin-analysis': {
      const cost = payload.cost ?? 2.66, price = payload.salePrice ?? 19.95;
      const marginPct = round2(((price - cost) / price) * 100);
      return { cost, salePrice: price, marginPct, verdict: price >= cost * CONFIG.marginRule ? 'clears the 3x threshold' : 'below the 3x threshold' };
    }
    case 'saturation-check':
      return { score: 'medium', activeSellers: 7, evidence: 'Sampled 40 listings; 7 storefronts posting consistently.' };
    case 'hook-generation': {
      const name = payload.productName || 'this';
      const pool = [
        'POV: you found the cheap version of a $600 job',
        `Nobody told me ${String(name).toLowerCase()} could do this`,
        'One pass. No scrubbing. Watch.',
        'This should be illegal for the price',
        'I was quoted four figures for this exact result',
        'Do NOT buy the expensive version first',
      ];
      // Rotate by product name so different products get different hooks.
      let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
      const off = h % pool.length;
      return { hooks: [...pool.slice(off), ...pool.slice(0, off)].slice(0, payload.count || 3) };
    }
    case 'sales-analysis':
      return { trend: 'up', topProduct: 'prd_grout01', recommendation: 'Shift content budget toward the grout pen; retire the pet brush.' };
    case 'supplier-verification':
      return { verified: true, liveCost: 2.66, rating: 4.9, ship: [8, 13] };
    case 'video-generation':
      return { jobId: 'sim_' + Math.random().toString(36).slice(2, 10), credits: 25 };
    default:
      return { note: 'simulated ' + taskType };
  }
}

/* =========================================================================
   [09] TASK ROUTER — queue + execution
   ========================================================================= */
async function runTask(type, payload = {}, opts = {}) {
  const choice = selectModel(type, opts);
  if (!choice) { toast('No usable model for ' + type, true); return null; }

  const task = {
    id: 'tsk_' + Math.random().toString(36).slice(2, 8),
    type, title: opts.title || type.replace(/-/g, ' '),
    status: 'running', model: choice.model.id, progress: 5, at: Date.now(),
  };
  S.tasks.unshift(task);
  render();

  const ticker = setInterval(() => {
    task.progress = Math.min(95, task.progress + 8 + Math.random() * 10);
    render();
  }, 380);

  try {
    const result = await callArena(choice.model.id, type, payload);
    clearInterval(ticker);
    Object.assign(task, { status: 'done', progress: 100, result: result.data, simulated: result.simulated });
    // Debit metered resources so the budget stays honest.
    if (choice.model.id === 'runway-gen3') choice.model.credits = Math.max(0, choice.model.credits - 25);
    if (choice.model.id === 'fable-5') choice.model.spendUsed = round2(choice.model.spendUsed + choice.model.costPerRun);
    toast('✓ ' + task.title);
  } catch (err) {
    clearInterval(ticker);
    Object.assign(task, { status: 'failed', error: err.message });
    toast('✕ ' + task.title + ' — ' + err.message, true);
  }
  save(); render();
  return task;
}

/* =========================================================================

   ========================================================================= */
const Scout = {
  /** 0-100 score against the five criteria. Tune the weights here. */
  score({ marginPct, momentum, saturation, visualDemo = true, shipMax }) {
    let s = 0;
    s += Math.min(35, Math.max(0, (marginPct - 50)));                       // margin, cap 35
    s += { rising: 25, peaking: 18, flat: 8, cooling: 2 }[momentum] ?? 8;   // trend
    s += { low: 25, medium: 14, high: 3 }[saturation] ?? 10;                // competition
    s += visualDemo ? 10 : 0;
    s += shipMax != null && shipMax <= 14 ? 5 : 0;
    return Math.round(Math.min(100, s));
  },

  async runCycle() {
    const t = await runTask('product-scout', { niche: 'auto-select' }, { title: 'Product Scout — manual run' });
    if (!t || !t.result?.candidates) return;

    const known = new Set(S.products.map((p) => p.name.toLowerCase()));
    const fresh = t.result.candidates.filter((c) => !known.has(c.name.toLowerCase()));
    if (!fresh.length) { toast('No new candidates — all already tracked'); return; }

    for (const c of fresh) {
      const marginPct = round2(((c.price - c.cost) / c.price) * 100);
      S.products.push({
        id: 'prd_' + Math.random().toString(36).slice(2, 8),
        name: c.name, category: c.category, stage: 'researching',
        cost: c.cost, salePrice: c.price,
        supplier: { url: 'https://www.aliexpress.com/w/wholesale-' + c.name.toLowerCase().replace(/\s+/g, '-') + '.html', rating: 4.6, unitsSold: 0, ship: [9, 16] },
        trend: { hashtag: '#new', momentum: 'rising', evidence: 'Surfaced by the scout cycle.' },
        saturation: { score: 'medium', sellers: 7, evidence: 'Pending verification.' },
        angles: simulate('hook-generation', { productName: c.name, count: 3 }).hooks,
        risks: ['Unverified supplier — confirm cost before scaling'],
        score: Scout.score({ marginPct, momentum: 'rising', saturation: 'medium', shipMax: 16 }),
      });
    }
    toast(`Added ${fresh.length} product(s)`);
    save(); render();
  },
};

const Studio = {
  async generate(productId) {
    const p = S.products.find((x) => x.id === productId) || S.products[0];
    if (!p) return;
    const t = await runTask('hook-generation', { productName: p.name, count: 3 }, { title: 'Hooks — ' + p.name });
    if (!t?.result?.hooks) return;

    const formats = ['transformation', 'reveal', 'satisfying-demo'];

    t.result.hooks.forEach((hook, i) => {

        status: 'draft', engine: 'manual',
        script: [
          { t: '0-3s',  shot: 'Tight shot of the problem state' },
          { t: '3-10s', shot: 'One continuous action — no cuts' },
          { t: '10-15s', shot: 'Pull back to the result' },
        ],
        tags: ['#' + p.category, '#tiktokmademebuyit'],
        metrics: { views: 0, likes: 0, clicks: 0, cvr: 0 },
      });
    });
    toast(`Added ${t.result.hooks.length} clips for ${p.name}`);
    save(); render();
  },
};

const Tracker = {
  /** Trailing-window revenue plus the delta against the prior window. */
  window(days = 7) {
    const d = S.sales.daily;
    const sum = (a) => round2(a.reduce((s, x) => s + x.revenue, 0));
    const cur = sum(d.slice(-days));
    const prev = sum(d.slice(-days * 2, -days));
    return { cur, prev, deltaPct: prev > 0 ? round2(((cur - prev) / prev) * 100) : (cur > 0 ? 100 : 0) };
  },
  byProduct() {
    const acc = {};
    for (const o of S.orders) {
      if (o.status === 'refunded') continue;
      const a = (acc[o.productId] ||= { productId: o.productId, revenue: 0, units: 0 });
      a.revenue = round2(a.revenue + o.unitPrice * o.quantity);
      a.units += o.quantity;
    }
    return Object.values(acc).sort((a, b) => b.revenue - a.revenue);
  },
};

function freshState() {
  const products = structuredClone(SEED_PRODUCTS).map((p) => ({
    ...p, marginPct: round2(((p.salePrice - p.cost) / p.salePrice) * 100),
  }));
  const { orders, dates } = generateSales(products, CONFIG.salesDays, CONFIG.salesSeed);
  return {
    products,
    clips: structuredClone(SEED_CLIPS),
    tasks: structuredClone(SEED_TASKS),
    orders, dates,
    sales: summarize(orders, dates),
  };
}

function save() {
  if (!CONFIG.persist) return;
  try {
    localStorage.setItem(CONFIG.storageKey, JSON.stringify({
      products: S.products, clips: S.clips, tasks: S.tasks.slice(0, 40), orders: S.orders, dates: S.dates,
    }));
  } catch { /* quota or private mode — run in memory */ }
}

function load() {
  if (!CONFIG.persist) return freshState();
  try {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (!raw) return freshState();
    const d = JSON.parse(raw);
    if (!d.products?.length || !d.orders?.length) return freshState();
    return { ...d, sales: summarize(d.orders, d.dates) };
  } catch { return freshState(); }
}

const compact = (n) => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n); };
const rel = (ts) => { const s = (Date.now() - ts) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };

function chart(daily) {
  if (!daily?.length) return empty('i-chart', 'No revenue yet', 'Orders will plot here.');
  const max = Math.max(...daily.map((d) => d.revenue)) || 1;
  const fmt = (s) => new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      <div class="bar" style="height:${Math.max(2, (d.revenue / max) * 100)}%;animation-delay:${i * 12}ms"></div>
    </div>`).join('');
  return `<div class="chart">${bars}</div>
          <div class="chart-axis"><span>${fmt(daily[0].date)}</span><span>${fmt(daily[daily.length - 1].date)}</span></div>`;

function taskRow(t) {
  const ic = t.status === 'running' ? { i: 'i-bolt', c: 'running' }

           : t.status === 'failed'  ? { i: 'i-alert', c: 'failed' }
           : { i: 'i-clock', c: '' };
  const bar = t.status === 'running' || t.status === 'queued'
    ? `<div class="progress"><i style="width:${t.progress || 0}%"></i></div>`
    : t.status === 'failed' ? `<div class="progress failed"><i style="width:${t.progress || 100}%"></i></div>` : '';
  return `<div class="task">
    <div class="task-icon ${ic.c}">${icon(ic.i)}</div>
    <div class="task-body">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta"><code>${esc(t.model || '—')}</code> · ${esc(t.status)} · ${rel(t.at)}${t.error ? ` · <span style="color:var(--danger)">${esc(t.error)}</span>` : ''}</div>
      ${bar}
    </div></div>`;
}

function toast(msg, err) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; setTimeout(() => el.remove(), 220); }, 3400);
}

      </div>`;
    }).join('');

    return `<div class="section-head"><div class="chip-row">${filters}</div><span class="spacer"></span>
      <button class="btn btn-primary" data-act="scout">${icon('i-play')} Run scout cycle</button></div>
      <div class="grid grid-cards" id="pgrid">${cards}</div>`;
  },

  studio() {
    if (!S.clips.length) {
      return empty('i-film', 'No clips yet', 'Generate hooks for a product to start the content engine.',
        `<button class="btn btn-primary" data-act="studio">${icon('i-play')} Generate clips</button>`);
    }
    const views = S.clips.reduce((s, c) => s + c.metrics.views, 0);
    const clicks = S.clips.reduce((s, c) => s + c.metrics.clicks, 0);
    const published = S.clips.filter((c) => c.status === 'published').length;
    const rendering = S.clips.filter((c) => c.status === 'queued' || c.status === 'rendering').length;

    const order = { published: 0, rendering: 1, queued: 2, draft: 3, archived: 4 };
    const cards = [...S.clips]
      .sort((a, b) => (order[a.status] - order[b.status]) || b.metrics.views - a.metrics.views)
      .map((c) => {
        const kind = c.status === 'published' ? 'winning' : c.status === 'archived' ? 'dead' : c.status === 'draft' ? 'neutral' : 'sourcing';
        return `<div class="card card-hover pcard">
          <div class="pcard-top">
            <div style="min-width:0"><div class="pname">“${esc(c.hook)}”</div>
              <div class="pcat">${esc(productName(c.productId))} · ${esc(c.platform)}</div></div>
            <span class="spacer"></span>${badge(c.status, kind)}
          </div>
          <div class="metric-row">
            ${metric('Views', compact(c.metrics.views))}${metric('Likes', compact(c.metrics.likes))}
            ${metric('Clicks', compact(c.metrics.clicks))}${metric('CVR', pct(c.metrics.cvr), true)}
          </div>
          <div style="font-size:12.5px;color:var(--text-dim)">
            ${c.script.map((b) => `<div style="display:flex;gap:9px;padding:3px 0">
              <code style="font-family:var(--mono);font-size:11px;color:var(--text-faint);flex:0 0 46px">${esc(b.t)}</code>
              <span>${esc(b.shot)}</span></div>`).join('')}
          </div>
          <div class="chip-row">${c.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
          <div class="kv" style="border-top:1px solid var(--border);padding-top:11px">
            <span class="k">Format</span><span class="v">${esc(c.format)}</span></div>
          <div class="kv"><span class="k">Engine</span><span class="v">${esc(c.engine)}</span></div>
        </div>`;
      }).join('');

    return `<div class="section"><div class="grid grid-kpi">
        ${kpi('Total views', compact(views), 'i-film', `<span style="color:var(--text-faint)">across ${S.clips.length} clips</span>`)}
        ${kpi('Clicks', compact(clicks), 'i-bolt', `<span style="color:var(--text-faint)">${views ? pct((clicks / views) * 100) : '0.0%'} CTR</span>`)}
        ${kpi('Published', String(published), 'i-check', `<span style="color:var(--text-faint)">${S.clips.length - published} in pipeline</span>`)}
        ${kpi('Render queue', String(rendering), 'i-clock', `<span style="color:var(--text-faint)">RunwayML Gen-3</span>`)}
      </div></div>
      <div class="section-head"><h2>Clip library</h2><span class="spacer"></span>
        <button class="btn btn-primary" data-act="studio">${icon('i-play')} Generate clips</button></div>
      <div class="grid grid-cards">${cards}</div>`;
  },

  sales() {
    const t = S.sales;
    if (!S.orders.length) return empty('i-chart', 'No sales recorded', 'Connect a channel or run the tracker ingest.');

    const chanTotal = Object.values(t.byChannel).reduce((s, c) => s + c.revenue, 0) || 1;
    const channels = Object.entries(t.byChannel).map(([k, c]) => `
      <div style="margin-bottom:14px">
        <div style="display:flex;font-size:13px;margin-bottom:6px"><span>${esc(k)}</span><span class="spacer"></span>
          <span style="font-family:var(--mono);font-size:12.5px">${money(c.revenue)} · ${c.orders}</span></div>
        <div class="meter"><i style="width:${((c.revenue / chanTotal) * 100).toFixed(1)}%"></i></div>
      </div>`).join('');

    const rows = [...S.orders].slice(-14).reverse().map((o) => {
      const tone = o.status === 'refunded' ? 'dead' : o.status === 'delivered' ? 'winning' : 'active';
      return `<tr>
        <td style="font-family:var(--mono);font-size:12px;color:var(--text-faint)">${esc(o.id)}</td>
        <td>${esc(o.date)}</td><td>${esc(productName(o.productId))}</td><td>${esc(o.channel)}</td>
        <td class="num">${o.quantity}</td><td class="num">${money(o.unitPrice * o.quantity)}</td>
        <td>${badge(o.status, tone)}</td></tr>`;
    }).join('');

    return `<div class="section"><div class="grid grid-kpi">
        ${kpi('Revenue', money(t.revenue), 'i-dollar', `<span style="color:var(--text-faint)">${S.dates[0]} → ${S.dates[S.dates.length - 1]}</span>`)}
        ${kpi('COGS', money(t.cogs), 'i-box', '<span style="color:var(--text-faint)">landed cost</span>')}
        ${kpi('Gross profit', money(t.grossProfit), 'i-chart', `<span class="up">${pct(t.marginPct)} margin</span>`)}
        ${kpi('AOV', money(t.aov), 'i-bolt', `<span style="color:var(--text-faint)">${t.orders} paid orders</span>`)}
      </div></div>
      <div class="grid grid-2 section">
        <div class="card"><div class="card-head"><h2>Daily revenue</h2></div>${chart(t.daily)}</div>
        <div class="card"><div class="card-head"><h2>Channel split</h2></div>${channels}</div>
      </div>
      <div class="card"><div class="card-head"><h2>Recent orders</h2><span class="spacer"></span>
        <span style="font-size:12px;color:var(--text-faint)">last 14 of ${S.orders.length}</span></div>
        <div class="table-wrap"><table class="data"><thead><tr>
          <th>Order</th><th>Date</th><th>Product</th><th>Channel</th><th class="num">Qty</th><th class="num">Total</th><th>Status</th>
        </tr></thead><tbody>${rows}</tbody></table></div></div>`;
  },

  models() {
    const cards = MODELS.map((m) => {
      const tone = m.status === 'available' ? 'winning' : 'sourcing';
      const cost = m.cost != null ? '$' + m.cost.toFixed(4) + ' / 1k tok'
        : m.costPerRun != null ? '$' + m.costPerRun.toFixed(2) + ' / run'
        : m.creditsPerSec + ' credits / sec';
      return `<div class="card card-hover pcard">
        <div class="pcard-top">
          <div style="min-width:0"><div class="pname">${esc(m.label)}</div><div class="pcat">${esc(m.vendor)}</div></div>
          <span class="spacer"></span>${badge(m.status, tone)}</div>
        <div style="font-size:12.5px;color:var(--text-dim);line-height:1.55">${esc(m.strengths)}</div>
        <div class="chip-row">${m.caps.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>
        <div class="kv" style="border-top:1px solid var(--border);padding-top:11px"><span class="k">Cost</span><span class="v">${esc(cost)}</span></div>
        <div class="kv"><span class="k">Quality index</span><span class="v">${m.quality.toFixed(2)}</span></div>
        ${m.credits != null ? `<div class="kv"><span class="k">Credits left</span><span class="v">${m.credits}</span></div>` : ''}
        ${m.spendLimit != null ? `<div class="kv"><span class="k">Spend</span><span class="v">${money(m.spendUsed)} / ${money(m.spendLimit)}</span></div>` : ''}
      </div>`;
    }).join('');

    const rows = Object.entries(ROUTES).map(([k, r]) => `<tr>
      <td>${esc(k)}</td>
      <td><code style="font-family:var(--mono);font-size:12px;color:var(--accent)">${esc(r.primary || '—')}</code></td>
      <td><code style="font-family:var(--mono);font-size:12px;color:var(--text-dim)">${esc(r.fallback || '—')}</code></td>
      <td><code style="font-family:var(--mono);font-size:12px;color:var(--warn)">${esc(r.escalate || '—')}</code></td></tr>`).join('');

    return `<div class="grid grid-cards section">${cards}</div>
      <div class="card"><div class="card-head"><h2>Task routing table</h2></div>
        <div class="table-wrap"><table class="data"><thead><tr>
          <th>Task type</th><th>Primary</th><th>Fallback</th><th>Escalation</th>
        </tr></thead><tbody>${rows}</tbody></table></div></div>`;
  },

  settings() {
    const k = getKeys();
    const field = (id, label, val, hint) =>
      `<div class="field"><label for="${id}">${esc(label)}</label>
       <input id="${id}" type="password" value="${esc(val || '')}" autocomplete="off" spellcheck="false" />
       <div class="hint">${esc(hint)}</div></div>`;

    return `<div class="grid grid-2">
      <div class="card">
        <div class="card-head"><h2>API credentials</h2><span class="spacer"></span>
          ${badge(isDemo() ? 'demo mode' : 'live', isDemo() ? 'sourcing' : 'winning')}</div>
        <p style="font-size:12.5px;color:var(--text-dim);margin:0 0 16px">
          Stored in this browser only. Leave blank to keep every service simulated.</p>
        ${field('k_arena', 'Arena.ai API key', k.arena, 'Routes all specialist model calls.')}
        ${field('k_fable', 'Fable 5 API key', k.fable, 'Browser agent for live scraping. Metered.')}
        ${field('k_runway', 'RunwayML API key', k.runway, '125 credits in the current pool.')}
        <button class="btn btn-primary" data-act="save-keys">Save</button>
        <button class="btn btn-ghost" data-act="clear-keys">Clear</button>
      </div>
      <div class="card">
        <div class="card-head"><h2>System</h2></div>
        <div class="kv"><span class="k">Products</span><span class="v">${S.products.length}</span></div>
        <div class="kv"><span class="k">Clips</span><span class="v">${S.clips.length}</span></div>
        <div class="kv"><span class="k">Orders</span><span class="v">${S.orders.length}</span></div>
        <div class="kv"><span class="k">Tasks</span><span class="v">${S.tasks.length}</span></div>
        <div class="kv"><span class="k">Persistence</span><span class="v">${CONFIG.persist ? 'localStorage' : 'memory only'}</span></div>
        <div class="kv"><span class="k">Sales seed</span><span class="v">${CONFIG.salesSeed}</span></div>
        <p style="font-size:12px;color:var(--text-faint);margin:14px 0 0">
          Everything runs offline. No data leaves this browser unless you add a key.</p>
        <div style="margin-top:16px"><button class="btn btn-ghost" data-act="reset">Reset to seed data</button></div>
      </div>
    </div>`;
  },
};

/* =========================================================================
   [14] APP — boot, nav, events
   ========================================================================= */
function renderNav() {
  let html = '';
  let group = null;
  for (const item of NAV) {
    if (item.group !== group) { group = item.group; html += `<div class="nav-label">${esc(group)}</div>`; }
    const n = item.count ? item.count() : null;
    html += `<button class="nav-item${item.id === currentView ? ' active' : ''}" data-view="${item.id}">
      ${icon(item.icon)} ${esc(item.label)}${n != null ? `<span class="nav-count">${n}</span>` : ''}</button>`;
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  const meta = NAV.find((n) => n.id === currentView) || NAV[0];
  document.getElementById('viewTitle').textContent = meta.title;
  document.getElementById('viewSub').textContent = meta.sub;
  document.getElementById('content').innerHTML = VIEWS[currentView]();
  renderNav();
}

function setView(id) {
  if (!VIEWS[id]) id = 'dashboard';
  currentView = id;
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  render();
  closeNav();
}

const openNav = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('show'); };
const closeNav = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); };

document.addEventListener('click', async (e) => {
  const nav = e.target.closest('[data-view]');
  if (nav) return setView(nav.dataset.view);

  const jump = e.target.closest('[data-nav]');
  if (jump) return setView(jump.dataset.nav);

  const filter = e.target.closest('[data-filter]');
  if (filter) {
    const want = filter.dataset.filter;
    document.querySelectorAll('#pgrid .pcard').forEach((c) => {
      c.style.display = (want === 'all' || c.dataset.stage === want) ? '' : 'none';
    });
    document.querySelectorAll('[data-filter]').forEach((b) => b.classList.toggle('on', b === filter));
    return;
  }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  switch (act.dataset.act) {
    case 'run': runCycle(); break;
    case 'scout':  Scout.runCycle(); break;
    case 'studio': Studio.generate(S.products.find((p) => p.stage !== 'dead')?.id); break;
    case 'save-keys':
      setKeys({
        arena: document.getElementById('k_arena').value.trim(),
        fable: document.getElementById('k_fable').value.trim(),
        runway: document.getElementById('k_runway').value.trim(),
      });
      toast('Credentials saved to this browser'); render();
      break;
    case 'clear-keys':
      localStorage.removeItem('scorpion.keys'); toast('Credentials cleared'); render();
      break;
    case 'reset':
      localStorage.removeItem(CONFIG.storageKey);
      S = freshState(); save(); toast('Reset to seed data'); render();
      break;
  }
});

document.getElementById('menuToggle').addEventListener('click', () =>
  document.getElementById('sidebar').classList.contains('open') ? closeNav() : openNav());
document.getElementById('scrim').addEventListener('click', closeNav);
function runCycle() {
  toast('Orchestration cycle started');
  runTask('trend-research', {}, { title: 'Trend sweep — all niches' });
  setTimeout(() => runTask('hook-generation',
    { productName: S.products[0]?.name, count: 3 },
    { title: 'Hook batch — ' + (S.products[0]?.name || 'top product') }), 600);
  setTimeout(() => runTask('sales-analysis', { window: 7 }, { title: 'Weekly revenue analysis' }), 1200);
}
document.getElementById('btnRun').addEventListener('click', runCycle);
document.getElementById('btnReset').addEventListener('click', () => {
  localStorage.removeItem(CONFIG.storageKey);
  S = freshState(); save(); toast('Reset to seed data'); render();
});
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (VIEWS[id] && id !== currentView) setView(id);
});

/* --- boot ----------------------------------------------------------------- */
S = load();
const initial = location.hash.slice(1);
if (VIEWS[initial]) currentView = initial;
render();

// Exposed for console tinkering: Scorpion.state(), Scorpion.run('trend-research')
window.Scorpion = {
  state: () => S, render, setView,
  run: runTask, scout: Scout, studio: Studio, tracker: Tracker,
  models: MODELS, routes: ROUTES, config: CONFIG,
  reset: () => { localStorage.removeItem(CONFIG.storageKey); S = freshState(); render(); },
};
</script>
</body>
</html>

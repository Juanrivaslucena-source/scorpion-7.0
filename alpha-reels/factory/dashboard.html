<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel Factory</title>
<style>
  :root {
    --bg: #0a0a0a; --panel: #131313; --panel2: #1a1a1a; --line: #262626;
    --text: #f2f2f2; --dim: #8a8a8a; --accent: #c6ff00; --accent2: #00e0ff;
    --ok: #38d66b; --warn: #ffb020; --bad: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 24px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(10,10,10,.9);
    backdrop-filter: blur(8px); z-index: 5; }
  .logo { font-weight: 900; font-size: 22px; letter-spacing: -1px; text-transform: uppercase; }
  .logo b { background: var(--accent); color: #000; padding: 2px 8px; }
  .pills { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); }
  .pill.on { color: var(--accent); border-color: var(--accent); }
  .pill.off { color: var(--dim); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .drop { border: 2px dashed var(--line); border-radius: 16px; padding: 40px; text-align: center;
    cursor: pointer; transition: .15s; background: var(--panel); }
  .drop:hover, .drop.hot { border-color: var(--accent); background: #141a06; }
  .drop h2 { margin: 0 0 6px; font-size: 20px; }
  .drop p { margin: 0; color: var(--dim); font-size: 14px; }
  .drop .big { font-size: 40px; margin-bottom: 8px; }
  h3.section { margin: 34px 0 14px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--dim); }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    margin-bottom: 16px; overflow: hidden; }
  .job-head { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
  .job-title { font-weight: 700; }
  .job-sub { color: var(--dim); font-size: 12px; }
  .status { margin-left: auto; font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); white-space: nowrap; }
  .status.running { color: var(--accent2); border-color: var(--accent2); }
  .status.awaiting { color: var(--warn); border-color: var(--warn); }
  .status.done { color: var(--ok); border-color: var(--ok); }
  .status.failed, .status.rejected { color: var(--bad); border-color: var(--bad); }
  /* pipeline */
  .pipe { display: flex; gap: 6px; padding: 0 18px 16px; flex-wrap: wrap; }
  .stage { flex: 1; min-width: 90px; text-align: center; padding: 10px 6px; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--line); font-size: 11px; color: var(--dim);
    position: relative; transition: .2s; }
  .stage .dot { font-size: 16px; display: block; margin-bottom: 4px; }
  .stage.done { color: var(--text); border-color: #2f3d10; background: #141a06; }
  .stage.done .dot { color: var(--accent); }
  .stage.active { border-color: var(--accent2); color: var(--accent2); }
  .stage.active .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .body { padding: 0 18px 18px; }
  .concept { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 14px; }
  .hook { display: inline-block; background: var(--accent); color: #000; font-weight: 900;
    text-transform: uppercase; padding: 4px 12px; font-size: 22px; letter-spacing: -.5px; }
  .concept p { color: var(--dim); margin: 10px 0 0; font-size: 14px; }
  .caption { white-space: pre-wrap; font-size: 14px; margin-top: 10px; }
  .tags { color: var(--accent2); font-size: 13px; margin-top: 6px; }
  .shots { margin-top: 10px; font-size: 13px; color: var(--dim); }
  .shots li { margin: 3px 0; }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  button { font: inherit; font-weight: 700; border: none; border-radius: 10px; padding: 11px 20px;
    cursor: pointer; }
  .approve { background: var(--accent); color: #000; }
  .reject { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button:disabled { opacity: .4; cursor: default; }
  video { width: 100%; max-width: 300px; border-radius: 12px; background: #000; display: block; }
  .reel-row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .meta { flex: 1; min-width: 200px; }
  .score { font-size: 40px; font-weight: 900; color: var(--accent); }
  .score small { font-size: 14px; color: var(--dim); font-weight: 400; }
  .empty { color: var(--dim); text-align: center; padding: 30px; }
  a.dl { color: var(--accent2); font-size: 13px; }
  /* goal banner */
  .goal { background: linear-gradient(90deg, #141a06, var(--panel)); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 22px; }
  .goal.ready { border-color: var(--accent); }
  .goal.auto { border-color: var(--ok); background: linear-gradient(90deg, #0c1a10, var(--panel)); }
  .goal-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .goal-top h3 { margin: 0; font-size: 15px; }
  .goal-top .tgt { color: var(--dim); font-size: 12px; margin-left: auto; }
  .meters { display: flex; gap: 18px; flex-wrap: wrap; }
  .meter { flex: 1; min-width: 150px; }
  .meter label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .track { height: 8px; background: var(--panel2); border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
  .fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
  .fill.g { background: var(--ok); } .fill.b { background: var(--accent2); }
  .meter .v { font-size: 12px; color: var(--text); }
  .predict { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--line);
    color: var(--dim); margin-left: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">REEL <b>FACTORY</b></div>
  <div class="pills" id="pills"></div>
</header>
<main>
  <div id="goal"></div>

  <div class="drop" id="drop">
    <div class="big">⬆️</div>
    <h2>Drop a video or image here</h2>
    <p>or click to choose — the agents take it from there</p>
    <input type="file" id="file" accept="video/*,image/*" hidden />
  </div>

  <h3 class="section">Jobs</h3>
  <div id="jobs"><div class="empty">No jobs yet. Drop a clip above to start.</div></div>
</main>

<script>
const STAGES = [
  ['dissect', '🔍', 'Dissect'],
  ['idea', '💡', 'Idea'],
  ['generate', '🎨', 'Generate'],
  ['edit', '✂️', 'Edit'],
  ['stitch', '🎬', 'Stitch'],
  ['qc', '✅', 'QC'],
];

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
drop.onclick = () => fileInput.click();
['dragover','dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) upload(f); });
fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); };

async function upload(file) {
  drop.querySelector('h2').textContent = 'Uploading ' + file.name + '…';
  await fetch('/api/upload?name=' + encodeURIComponent(file.name), { method: 'POST', body: file });
  drop.querySelector('h2').textContent = 'Drop a video or image here';
  refresh();
}
async function approve(id) { await fetch('/api/jobs/' + encodeURIComponent(id) + '/approve', { method: 'POST' }); refresh(); }
async function reject(id) {
  const why = prompt('Optional — why not? (helps it learn your taste)') || '';
  await fetch('/api/jobs/' + encodeURIComponent(id) + '/reject?reason=' + encodeURIComponent(why), { method: 'POST' });
  refresh();
}

function pct(v) { return Math.max(0, Math.min(100, Math.round(v * 100))); }
function renderGoal(g) {
  if (!g) return '';
  const cls = g.autopilot ? 'auto' : g.ready ? 'ready' : '';
  const dec = Math.min(1, g.total / g.minDecisions);
  const days = Math.min(1, g.daysElapsed / g.windowDays);
  const acc = g.recentAccuracy;
  const head = g.autopilot
    ? '✅ Autopilot engaged — reels finish without asking'
    : g.ready ? '🎉 Goal met — autopilot engages on your next decision'
    : '🎯 Teaching the agents your taste';
  return `<div class="goal ${cls}">
    <div class="goal-top"><h3>${head}</h3><span class="tgt">target ${g.targetDate}</span></div>
    <div class="meters">
      <div class="meter"><label>Reels judged</label>
        <div class="track"><div class="fill" style="width:${pct(dec)}%"></div></div>
        <div class="v">${g.total} / ${g.minDecisions} &nbsp; <span style="color:var(--dim)">${g.approvals}✓ ${g.rejections}✗</span></div></div>
      <div class="meter"><label>Predicts your call</label>
        <div class="track"><div class="fill b" style="width:${pct(acc)}%"></div></div>
        <div class="v">${pct(acc)}% <span style="color:var(--dim)">(need ${pct(g.accuracyTarget)}%)</span></div></div>
      <div class="meter"><label>Training window</label>
        <div class="track"><div class="fill g" style="width:${pct(days)}%"></div></div>
        <div class="v">day ${g.daysElapsed} / ${g.windowDays}</div></div>
    </div>
  </div>`;
}

function stageClass(job, key) {
  if (job.completedStages.includes(key)) return 'done';
  const nextIdx = job.completedStages.length;
  if (job.running && STAGES[nextIdx] && STAGES[nextIdx][0] === key) return 'active';
  return '';
}

function renderJob(job) {
  const pipe = STAGES.map(([k, icon, label]) =>
    `<div class="stage ${stageClass(job, k)}"><span class="dot">${icon}</span>${label}</div>`).join('');

  let statusClass = job.status, statusText = job.status;
  if (job.status === 'awaiting-approval') { statusClass = 'awaiting'; statusText = '⏸ needs your OK'; }
  if (job.status === 'running') statusText = '● working…';

  let body = '';
  if (job.hook) {
    body += `<div class="concept">
      <span class="hook">${esc(job.hook)}</span>
      <p>${esc(job.concept)}</p>
      <div class="caption">${esc(job.caption)}</div>
      <div class="tags">${(job.hashtags||[]).map(esc).join(' ')}</div>
      <ul class="shots">${(job.shotlist||[]).map(s => `<li>▸ ${s.seconds}s — ${esc(s.beat)} <em>(${s.source})</em></li>`).join('')}</ul>
    </div>`;
  }
  if (job.awaitingApproval) {
    const guess = job.predicted && job.predicted !== 'unknown'
      ? `<span class="predict">coach's guess: ${job.predicted === 'approved' ? '👍 approve' : '👎 reject'} · ${pct(job.predictedConf||0)}%</span>`
      : '';
    body += `<div class="actions">
      <button class="approve" onclick="approve('${job.id}')">Approve & finish ✓</button>
      <button class="reject" onclick="reject('${job.id}')">Reject</button>
      ${guess}
    </div>`;
  }
  if (job.hasVideo) {
    body += `<div class="reel-row">
      <video controls src="/api/jobs/${encodeURIComponent(job.id)}/video"></video>
      <div class="meta">
        ${job.virality != null ? `<div class="score">${job.virality}<small>/100 virality</small></div>` : ''}
        <div class="job-sub" style="margin:6px 0 12px">${esc(job.verdict||'')}</div>
        <a class="dl" href="/api/jobs/${encodeURIComponent(job.id)}/video" download>⬇ download reel</a>
      </div>
    </div>`;
  }

  return `<div class="job">
    <div class="job-head">
      <div><div class="job-title">${esc(job.source)}</div><div class="job-sub">${job.id}</div></div>
      <div class="status ${statusClass}">${statusText}</div>
    </div>
    <div class="pipe">${pipe}</div>
    <div class="body">${body}</div>
  </div>`;
}

function esc(s) { return String(s==null?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function refresh() {
  try {
    const r = await fetch('/api/jobs');
    const { jobs, engines, goal } = await r.json();
    document.getElementById('goal').innerHTML = renderGoal(goal);
    document.getElementById('pills').innerHTML = [
      `<span class="pill">${engines.brand}</span>`,
      `<span class="pill ${engines.claude ? 'on':'off'}">Claude ${engines.claude?'on':'off'}</span>`,
      `<span class="pill ${engines.generate ? 'on':'off'}">AI-gen ${engines.generate?'on':'off'}</span>`,
      `<span class="pill">approve: ${engines.approvals}</span>`,
    ].join('');
    const el = document.getElementById('jobs');
    el.innerHTML = jobs.length ? jobs.map(renderJob).join('') : '<div class="empty">No jobs yet. Drop a clip above to start.</div>';
  } catch (e) { /* server may be restarting */ }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>

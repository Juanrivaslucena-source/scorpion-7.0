name: Render All Compositions

on:
  push:
    branches: [claude/first-pr-setup-ttqfio]
    paths:
      - 'alpha-reels/src/**'
      - 'alpha-reels/public/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        composition:
          - ArcticLeopard
          - 79Bike
          - VentusOnePlus
          - YozmaIN10Pro
          - eRideProSS
          - SurRonUltraBee
          - YVolt
          - AltisSigma
          - RealBrandReel
          - RealBikeLineup
          - HardCutReel
          - AestheticEdit
          - JustDropped
          - FinancingHook
          - Bikelife
          - RideAndRepair

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'repo/alpha-reels/package-lock.json'

      - name: Install dependencies
        working-directory: repo/alpha-reels
        run: npm ci

      - name: Render ${{ matrix.composition }}
        working-directory: repo/alpha-reels
        run: npx remotion render ${{ matrix.composition }} --output out/${{ matrix.composition }}.mp4 --concurrency 1
        timeout-minutes: 30

      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ matrix.composition }}
          path: repo/alpha-reels/out/${{ matrix.composition }}.mp4
          retention-days: 30

  combine:
    runs-on: ubuntu-latest
    needs: render
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: videos
          pattern: rendered-video-*

      - name: List rendered videos
        run: |
          echo "Rendered compositions:"
          find videos -name "*.mp4" | wc -l

      - name: Create summary
        run: |
          echo "# Render Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ All 16 compositions rendered successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          find videos -name "*.mp4" -exec basename {} \; | sort | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
